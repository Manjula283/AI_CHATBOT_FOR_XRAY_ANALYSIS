services:
  - type: web
    name: thoraxai-chest-xray
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1"
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: ENABLE_DEMO_ACCESS
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
